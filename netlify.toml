# Netlify configuration file
[build]
  # Build command
  command = "pnpm run build"

  # Directory that contains the deploy-ready HTML files and assets
  publish = "dist"

  # Install pnpm before building
  [build.environment]
    NODE_VERSION = "22"
    PNPM_VERSION = "8.15.0"
    # Fail the install if pnpm-lock.yaml is out of date instead of re-resolving
    PNPM_FLAGS = "--frozen-lockfile"

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # script-src hash = the inline theme script in index.html. If you edit that
    # script, update the hash here (scripts/check-csp.mjs fails the build until you do).
    # style-src needs 'unsafe-inline' for Emotion/MUI runtime styles.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Av0SsqsCRr4lbM0MVFZb3gyt+5W55nAfV+VVY+OOXKI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
