# Netlify configuration file
[build]
  # Build command
  command = "pnpm run build"

  # Directory that contains the deploy-ready HTML files and assets
  publish = "dist"

  # Install pnpm before building
  [build.environment]
    NODE_VERSION = "24"
    PNPM_VERSION = "8.15.0"
    # Fail the install if pnpm-lock.yaml is out of date instead of re-resolving
    PNPM_FLAGS = "--frozen-lockfile"

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # No inline <script>/<style> ships (dark-only: the pre-paint theme script is gone),
    # so script-src and style-src need no hashes or 'unsafe-inline'. Tailwind compiles
    # to a linked stylesheet; React and Framer Motion style via the CSSOM, which CSP
    # allows. If you add an inline script, add its sha256 here (check-csp fails otherwise).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
